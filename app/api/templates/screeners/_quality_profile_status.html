<article class="card" style="border-color:rgba(246,200,95,0.32);">
  <div class="eyebrow">Quality Confluence · 30 snapshots</div>
  <div style="font-size:18px;font-weight:900;color:var(--ink);margin-bottom:6px;">{{ title }}</div>
  <div class="muted">{{ detail }}</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">
    <span class="default-chip">Market: {{ regime }}</span>
    <span class="default-chip">Breadth: {{ breadth }}%</span>
    <span class="default-chip">A-tier: {{ candidate_count }}</span>
  </div>
</article>
