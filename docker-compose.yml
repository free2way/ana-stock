services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PQW_STORAGE_DIR: /app/storage
      PQW_DATA_DIR: /app/data
      PQW_RAW_DATA_DIR: /app/data/raw
      PQW_NORMALIZED_DATA_DIR: /app/data/normalized
      PQW_QLIB_DATA_DIR: /app/data/qlib
      PQW_ARTIFACTS_DIR: /app/data/artifacts
      PQW_DATABASE_URL: ${PQW_DATABASE_URL:?Set PQW_DATABASE_URL to a PostgreSQL URL}
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
